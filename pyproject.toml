[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.0",
  "prek==0.5.5",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.16.0",
  "pytest-sugar==1.1.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "shpyx==0.0.38",
  "tenacity==9.1.4",
  "ty==0.0.84",
]

[project]
name = "pgmig"
dynamic = ["version"]
description = "Generate migrations between Postgres databases"
authors = [{ name = "Yossi Rozantsev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["postgres", "postgresql", "migrations", "database", "schema"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  #
  "psycopg>=3.3.5",
  "pydantic>=2.12",
  "typer>=0.15.4",
]

[project.optional-dependencies]
binary = [
  #
  "psycopg[binary]>=3.3.5",
]

[project.scripts]
pgmig = "pgmig._cli._cli:app"

[project.urls]
homepage = "https://github.com/Apakottur/pgmig"
repository = "https://github.com/Apakottur/pgmig"
documentation = "https://github.com/Apakottur/pgmig"

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true
