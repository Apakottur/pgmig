[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "asyncpg==0.32.0",
  "asyncpg-stubs==0.32.0",
  "coverage-conditional-plugin==0.9.0",
  "httpx==0.28.1",
  "mypy==2.4.0",
  "prek==0.5.7",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.17.0",
  "pytest-sugar==1.1.1",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "shpyx==0.1.0",
  "tenacity==9.2.1",
  "ty==0.0.91",
]
docs = [
  #
  "mkdocstrings-python==2.0.10",
  "zensical==0.0.71",
]

[project]
name = "pgmig"
dynamic = ["version"]
description = "Generate migrations between Postgres databases"
authors = [{ name = "Yossi Rozantsev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["postgres", "postgresql", "migrations", "database", "schema"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # The default driver is psycopg (pure Python), which talks to a system-provided libpq. Faster
  # builds and the asyncpg driver are opt-in extras below.
  "psycopg>=3.3.5",
  "pydantic>=2.12",
  "typer>=0.15.4",
]

[project.optional-dependencies]
# psycopg's C speedups compiled against the system libpq. Fast; recommended for production.
# Needs a C compiler and libpq headers at install time.
c = ["psycopg[c]>=3.3.5"]
# psycopg's C speedups shipped as a prebuilt wheel that bundles libpq. Fast and needs no build
# tools or system libpq -- but the bundled libpq/OpenSSL only update when psycopg-binary does,
# so psycopg recommends against it for production. Great for CLI / standalone use.
binary = ["psycopg[binary]>=3.3.5"]
# The asyncpg driver instead of psycopg. Needs no libpq at all. Select it with driver="asyncpg".
asyncpg = ["asyncpg>=0.31.0"]

[project.scripts]
pgmig = "pgmig._cli._cli:app"

[project.urls]
homepage = "https://github.com/Apakottur/pgmig"
repository = "https://github.com/Apakottur/pgmig"
documentation = "https://pgmig.readthedocs.io/"

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true
